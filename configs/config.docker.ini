[general]
# Self-signed certs are generated at build time (see Dockerfile).
# Set WEBRTC_HTTP=true in docker-compose.yml to bypass TLS for plain HTTP.
domain=localhost
cert=configs/certs/cert.pem
key=configs/certs/key.pem
bind=0.0.0.0
port=8086
html_root=web

[turn]
# Use 127.0.0.1 for local Docker testing only.
# Change to your host's public IP/domain for cross-network TURN relay.
public_ip=127.0.0.1
port=19302
port_tcp=19303
realm=flutter-webrtc

[websocket]
ping_interval=5
pong_timeout=15
