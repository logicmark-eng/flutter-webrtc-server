name: Deploy Flutter WebRTC Server

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0) - leave empty for auto-generation'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  SERVICE_NAME: flutter-webrtc.service
  S3_BUCKET_DEVELOP: ota-img-dev.lgmk-eng.com
  S3_BUCKET_MAIN2: ota-img-main2.logicmarkcloud.com
  DOMAIN_DEVELOP: flutter-webrtc-develop2.lgmk-eng.com
  DOMAIN_MAIN2: flutter-webrtc.main2.logicmarkcloud.com
  S3_KEEP_LAST: 5

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_filename: ${{ steps.version.outputs.zip_filename }}
      environment: ${{ steps.environment.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine environment
        id: environment
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            ENVIRONMENT="develop"
          elif [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == refs/tags/* ]]; then
            ENVIRONMENT="main2"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            case "${BRANCH}" in
              develop) ENVIRONMENT="develop" ;;
              master)  ENVIRONMENT="main2" ;;
              *)
                echo "Unsupported branch for workflow_dispatch: ${BRANCH}"
                exit 1
                ;;
            esac
          else
            echo "Unsupported ref: ${{ github.ref }}"
            exit 1
          fi

          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "Target environment: ${ENVIRONMENT}"

      - name: Determine version
        id: version
        run: |
          ENVIRONMENT="${{ steps.environment.outputs.environment }}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            VERSION="v0.0.0-${BRANCH_NAME}-${GITHUB_SHA::7}"
          fi

          ZIP_FILENAME="flutter-webrtc-server-${ENVIRONMENT}-${VERSION}.zip"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "zip_filename=${ZIP_FILENAME}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"
          echo "ZIP filename: ${ZIP_FILENAME}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Go binary
        run: |
          echo "Building Go binary..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o webrtc-server \
            cmd/server/main.go
          echo "Binary built:"
          ls -lh webrtc-server

      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          zip -r "${{ steps.version.outputs.zip_filename }}" . \
            -x "*.git*" \
            -x "*.github*" \
            -x "*bin/*" \
            -x "*.zip" \
            -x "*node_modules/*" \
            -x "*.DS_Store" \
            -x "*__pycache__/*" \
            -x "*.vscode/*" \
            -x "*.idea/*"
          echo "Package created:"
          ls -lh "${{ steps.version.outputs.zip_filename }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-server-package
          path: ${{ steps.version.outputs.zip_filename }}
          retention-days: 30

  deploy:
    name: Deploy to ${{ needs.build.outputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webrtc-server-package

      - name: Set environment-specific variables
        run: |
          ENVIRONMENT="${{ needs.build.outputs.environment }}"

          if [[ "${ENVIRONMENT}" == "develop" ]]; then
            echo "S3_BUCKET=${{ env.S3_BUCKET_DEVELOP }}" >> $GITHUB_ENV
            echo "DEPLOY_DOMAIN=${{ env.DOMAIN_DEVELOP }}" >> $GITHUB_ENV
            echo "ROLE_ARN=${{ secrets.AWS_ROLE_TO_ASSUME_DEVELOP }}" >> $GITHUB_ENV
          elif [[ "${ENVIRONMENT}" == "main2" ]]; then
            echo "S3_BUCKET=${{ env.S3_BUCKET_MAIN2 }}" >> $GITHUB_ENV
            echo "DEPLOY_DOMAIN=${{ env.DOMAIN_MAIN2 }}" >> $GITHUB_ENV
            echo "ROLE_ARN=${{ secrets.AWS_ROLE_TO_ASSUME_MAIN2 }}" >> $GITHUB_ENV
          elif [[ "${ENVIRONMENT}" == "qa" ]]; then
            echo "ROLE_ARN=${{ secrets.AWS_ROLE_TO_ASSUME_QA }}" >> $GITHUB_ENV
          elif [[ "${ENVIRONMENT}" == "staging" ]]; then
            echo "ROLE_ARN=${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}" >> $GITHUB_ENV
          fi

          echo "S3_PREFIX=flutter-webrtc-server-${ENVIRONMENT}" >> $GITHUB_ENV
          echo "Environment: ${ENVIRONMENT}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-WebRTC-Deploy-${{ needs.build.outputs.environment }}

      - name: Upload package to S3
        run: |
          TARGET="s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/${{ needs.build.outputs.zip_filename }}"
          echo "Uploading to: ${TARGET}"

          aws s3 cp \
            "${{ needs.build.outputs.zip_filename }}" \
            "${TARGET}" \
            --metadata "version=${{ needs.build.outputs.version }},git-sha=${{ github.sha }},deployed-by=${{ github.actor }},environment=${{ needs.build.outputs.environment }}" \
            --no-progress

          echo "Upload complete"
          aws s3 ls "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/"

      - name: Rotate S3 packages (keep last ${{ env.S3_KEEP_LAST }})
        run: |
          PREFIX="s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}"
          echo "Rotating packages in ${PREFIX}/ (keep last ${{ env.S3_KEEP_LAST }})..."

          PACKAGES=$(aws s3 ls "${PREFIX}/" \
            | grep '\.zip$' \
            | sort \
            | awk '{print $4}')

          TOTAL=$(echo "${PACKAGES}" | grep -c '.' || true)
          echo "Total packages: ${TOTAL}"

          if [[ "${TOTAL}" -gt "${{ env.S3_KEEP_LAST }}" ]]; then
            DELETE_COUNT=$(( TOTAL - ${{ env.S3_KEEP_LAST }} ))
            echo "Deleting ${DELETE_COUNT} old package(s)..."
            echo "${PACKAGES}" | head -n "${DELETE_COUNT}" | while read -r FILE; do
              echo "  Deleting: ${FILE}"
              aws s3 rm "${PREFIX}/${FILE}"
            done
          else
            echo "Nothing to rotate (${TOTAL} <= ${{ env.S3_KEEP_LAST }})"
          fi

      - name: Get EC2 instance ID
        id: get-instance
        run: |
          ENVIRONMENT="${{ needs.build.outputs.environment }}"
          echo "Looking for instance: lgmk-flutter-webrtc-server-${ENVIRONMENT}"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=lgmk-flutter-webrtc-server-${ENVIRONMENT}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text 2>/dev/null || echo "None")

          if [[ "${INSTANCE_ID}" == "None" || -z "${INSTANCE_ID}" ]]; then
            echo "No running instance found with tag Name=lgmk-flutter-webrtc-server-${ENVIRONMENT}"
            echo ""
            echo "Available WebRTC instances:"
            aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=*webrtc*" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].[InstanceId,Tags[?Key==`Name`].Value|[0],State.Name]' \
              --output table || true
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> $GITHUB_OUTPUT
          echo "Found instance: ${INSTANCE_ID}"

          aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].[InstanceId,PublicIpAddress,PrivateIpAddress,State.Name]' \
            --output table

      - name: Verify SSM agent
        run: |
          echo "Verifying SSM agent..."

          SSM_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ steps.get-instance.outputs.instance_id }}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text 2>/dev/null || echo "NotFound")

          if [[ "${SSM_STATUS}" != "Online" ]]; then
            echo "SSM agent not online for ${{ steps.get-instance.outputs.instance_id }} (status: ${SSM_STATUS})"
            exit 1
          fi

          echo "SSM agent is online"

      - name: Execute deployment via SSM
        id: deploy
        run: |
          ENVIRONMENT="${{ needs.build.outputs.environment }}"
          echo "Deploying to instance: ${{ steps.get-instance.outputs.instance_id }}"
          echo "  Environment: ${ENVIRONMENT}"
          echo "  Package:     ${{ needs.build.outputs.zip_filename }}"
          echo "  Domain:      ${{ env.DEPLOY_DOMAIN }}"
          echo "  S3 prefix:   ${{ env.S3_PREFIX }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy WebRTC Server ${{ needs.build.outputs.version }} to ${{ needs.build.outputs.environment }}" \
            --parameters 'commands=[
              "set -eu",
              "export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin",
              "echo \"==> WebRTC Server Deployment\"",
              "echo \"    Version:     ${{ needs.build.outputs.version }}\"",
              "echo \"    Package:     ${{ needs.build.outputs.zip_filename }}\"",
              "echo \"    Environment: ${{ needs.build.outputs.environment }}\"",
              "echo \"    Domain:      ${{ env.DEPLOY_DOMAIN }}\"",
              "echo \"    Git SHA:     ${{ github.sha }}\"",
              "echo \"\"",
              "rm -rf /tmp/webrtc-extract",
              "mkdir -p /tmp/webrtc-extract",
              "cd /tmp/webrtc-extract",
              "echo \"==> Downloading package from S3...\"",
              "aws s3 cp s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/${{ needs.build.outputs.zip_filename }} ./package.zip",
              "echo \"==> Extracting deployment script...\"",
              "unzip -q -j -o package.zip scripts/deploy-flutter-webrtc-server.sh",
              "chmod +x deploy-flutter-webrtc-server.sh",
              "echo \"==> Running deployment script...\"",
              "bash deploy-flutter-webrtc-server.sh -b ${{ env.S3_BUCKET }} -f ${{ needs.build.outputs.zip_filename }} -d ${{ env.DEPLOY_DOMAIN }} -e ${{ needs.build.outputs.environment }} -s ${{ env.SERVICE_NAME }}",
              "rm -rf /tmp/webrtc-extract",
              "echo \"\"",
              "echo \"Deployment completed successfully\""
            ]' \
            --timeout-seconds 600 \
            --output text \
            --query 'Command.CommandId')

          echo "command_id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "SSM Command ID: ${COMMAND_ID}"

          echo "Waiting for deployment to complete..."
          for i in {1..60}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text)

            echo "  [$i/60] Status: ${STATUS}"

            if [[ "${STATUS}" == "Success" ]]; then
              echo "Deployment completed successfully"
              break
            elif [[ "${STATUS}" == "Failed" || "${STATUS}" == "Cancelled" || "${STATUS}" == "TimedOut" ]]; then
              echo "Deployment failed with status: ${STATUS}"
              echo ""
              echo "Command output:"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${{ steps.get-instance.outputs.instance_id }}" \
                --query 'StandardOutputContent' \
                --output text
              echo ""
              echo "Command errors:"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${{ steps.get-instance.outputs.instance_id }}" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi

            sleep 10
          done

          if [[ "${STATUS}" != "Success" ]]; then
            echo "Deployment timed out after 10 minutes"
            exit 1
          fi

      - name: Get deployment logs
        if: always()
        run: |
          echo "Deployment logs:"
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ steps.get-instance.outputs.instance_id }}" \
            --query 'StandardOutputContent' \
            --output text || echo "No output available"

      - name: Verify service health
        run: |
          echo "Verifying service health..."

          HEALTH_CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo systemctl is-active ${{ env.SERVICE_NAME }} && echo \"Service is active\" || echo \"Service is NOT active\"",
              "sudo systemctl status ${{ env.SERVICE_NAME }} --no-pager -l"
            ]' \
            --timeout-seconds 60 \
            --query 'Command.CommandId' \
            --output text)

          sleep 5

          aws ssm get-command-invocation \
            --command-id "${HEALTH_CMD_ID}" \
            --instance-id "${{ steps.get-instance.outputs.instance_id }}" \
            --query 'StandardOutputContent' \
            --output text

      - name: Create deployment summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Deployment Summary

          | Field | Value |
          |-------|-------|
          | **Environment** | ${{ needs.build.outputs.environment }} |
          | **Version** | ${{ needs.build.outputs.version }} |
          | **Package** | ${{ needs.build.outputs.zip_filename }} |
          | **S3** | s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/ |
          | **Domain** | ${{ env.DEPLOY_DOMAIN }} |
          | **Instance** | ${{ steps.get-instance.outputs.instance_id }} |
          | **Deployed by** | ${{ github.actor }} |
          | **Git SHA** | ${{ github.sha }} |
          | **Branch** | ${{ github.ref_name }} |
          | **SSM Command** | ${{ steps.deploy.outputs.command_id }} |
          EOF
